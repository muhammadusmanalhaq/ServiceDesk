services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: servicedesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk -d servicedesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
