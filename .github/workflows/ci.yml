name: CI
on: [push, pull_request]

# Required for Azure OIDC authentication
permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: servicedesk_test
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build
      - run: dotnet list package --vulnerable --include-transitive
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install E2E Dependencies
        working-directory: ./e2e
        run: npm ci
      - name: Install Playwright Browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps
      - name: Setup Postgres Roles
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE servicedesk_app WITH LOGIN PASSWORD 'TestPassword123!' SUPERUSER;"
          psql -h localhost -U postgres -c "CREATE ROLE servicedesk_system WITH LOGIN PASSWORD 'TestPassword123!' SUPERUSER;"
          psql -h localhost -U postgres -c "CREATE DATABASE servicedesk_test OWNER servicedesk_system;" || true
          psql -h localhost -U postgres -d servicedesk_test -c "GRANT ALL PRIVILEGES ON DATABASE servicedesk_test TO servicedesk_app, servicedesk_system;"
        env:
          PGPASSWORD: testpass
      - name: Start Backend API
        run: |
          export ASPNETCORE_ENVIRONMENT=Testing
          export ASPNETCORE_URLS=http://127.0.0.1:5093
          export ConnectionStrings__Default="Host=localhost;Database=servicedesk_test;Username=servicedesk_app;Password=TestPassword123!"
          export ConnectionStrings__System="Host=localhost;Database=servicedesk_test;Username=servicedesk_system;Password=TestPassword123!"
          export Jwt__Key="Test-SuperSecretKey-AtLeast32Characters-2026!"
          
          dotnet run --project src/ServiceDesk.Api/ServiceDesk.Api.csproj > api.log 2>&1 &
          
          echo "Waiting for API to boot..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5093/health > /dev/null; then
              echo "API is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API failed to start. Printing api.log:"
              cat api.log
              exit 1
            fi
            sleep 1
          done
      - name: Build and Start Frontend
        run: |
          cd src/servicedesk-web
          npm ci
          npm run build
          npx serve@latest out -p 3000 &
          cd ../..
          
          echo "Waiting for Frontend to boot..."
          for i in {1..15}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Frontend is healthy!"
              break
            fi
            sleep 1
          done
      - name: Run Playwright Tests
        working-directory: ./e2e
        run: npx playwright test
      - name: Upload Playwright Report (Visual Proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - name: Dump API Logs on Failure
        if: failure()
        run: |
          if [ -f api.log ]; then
            echo "=== API STACK TRACE LOGS ==="
            cat api.log
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Staging
        id: deploy
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "Deploying to Staging..."
            az deployment group create --resource-group servicedesk-rg --template-file infra/main.bicep \
              --parameters deployApp=true appName=ca-servicedesk-api-staging imageName=ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
            
            APP_FQDN=$(az containerapp show -n ca-servicedesk-api-staging -g servicedesk-rg --query properties.configuration.ingress.fqdn -o tsv)
            echo "app-url=https://$APP_FQDN" >> $GITHUB_OUTPUT
            
      - name: Smoke Test
        run: |
          echo "Waiting for container to boot..."
          for i in {1..12}; do
            if curl -s -f ${{ steps.deploy.outputs.app-url }}/health > /dev/null; then
              echo "Container is up!"
              exit 0
            fi
            echo "Waiting for container to boot... ($i/12)"
            sleep 10
          done
          echo "Container failed to start in time."
          exit 1

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Production
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "Deploying exactly ${{ github.sha }} to Production..."
            az deployment group create --resource-group servicedesk-rg --template-file infra/main.bicep \
              --parameters deployApp=true appName=ca-servicedesk-api imageName=ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
